# Full stack: PostgreSQL + pgvector, FastAPI backend, Next.js frontend.
#   cp .env.example .env      # optional: add ANTHROPIC_API_KEY, APP_API_TOKEN, ...
#   docker compose up --build
# App: http://localhost:3000 (the browser only talks to the frontend, which proxies /api to the backend)
# API docs: http://127.0.0.1:8000/docs (bound to loopback only)
name: ai-course-assistant

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides whatever .env says so the container always talks to the compose database.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/course_assistant
      UPLOAD_DIR: /app/data/uploads
      DEMO_DIR: /app/sample_data
    volumes:
      - uploads:/app/data/uploads
      - ./sample_data:/app/sample_data:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      APP_API_TOKEN: ${APP_API_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
